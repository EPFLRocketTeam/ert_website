<div class="main">
  <div class="page" style="padding: 30px;">our past and future competition projects</div>

  <div class="timeline-box">

    <!-- subtle red glow top-right -->
    <div class="timeline-glow"></div>

    <!-- Timeline nodes -->
    <div class="timeline-row">

      <!-- Connecting line (grey base) -->
      <div class="timeline-line"></div>
      <!-- Connecting line (red: node1 → node2) -->
      <div class="timeline-line-progress"></div>

      <!-- FIREHORN -->
      <div class="timeline-node">
        <div class="timeline-badge timeline-badge--completed">3 km</div>
        <div class="timeline-circle timeline-circle--completed">
          <span>2025</span>
        </div>
        <div class="timeline-title">Firehorn</div>
        <div class="timeline-desc">Bi-Liquid rocket built by students</div>
        <div class="timeline-status timeline-status--completed">COMPLETED</div>
      </div>

      <!-- FIREHORN II -->
      <div class="timeline-node">
        <div class="timeline-badge timeline-badge--upcoming">3 km</div>
        <div class="timeline-circle timeline-circle--upcoming">
          <span>2026</span>
        </div>
        <div class="timeline-title">Firehorn II</div>
        <div class="timeline-desc">Third Generation Bi-Liquid rocket</div>
        <div class="timeline-status timeline-status--upcoming">UPCOMING</div>
      </div>

      <!-- OUR GOAL -->
      <div class="timeline-node">
        <div class="timeline-badge">100 km</div>
        <div class="timeline-circle timeline-circle--future">
          <span>2030</span>
        </div>
        <div class="timeline-title timeline-title--muted">Our goal</div>
        <div class="timeline-desc timeline-desc--muted">First European team to reach space</div>
        <div class="timeline-status timeline-status--future">FUTURE</div>
      </div>

    </div>
  </div>

  <div style="display: flex; justify-content: flex-end; margin: 0 30px 30px;">
    <button type="button" onclick="location.href='/projects/firehorn'" class="button-right gray-button">Participate in the competition with us</button>
  </div>
</div>
